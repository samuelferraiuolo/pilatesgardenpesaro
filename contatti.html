<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatti e Orari | Pilates Garden Pesaro</title>
<link rel="stylesheet" href="common.css">

<!-- ===================================================
     FONT: Cormorant Garamond (titoli, resta invariato)
     + Inter (nuovo font sans-serif per corpo/interfaccia,
     molto più leggibile e moderno del generico sans-serif)
=================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ===================================================
   TOKEN DI DESIGN — stessa palette del brand, solo
   organizzata meglio e con qualche sfumatura in più
   per dare profondità senza tradire i colori originali
=================================================== */
:root {
    --crema-sfondo: #F3EEE4;
    --crema-carta: #FBF9F4;
    --verde-salvia: #9AA08A;
    --verde-salvia-chiaro: #C3C9B6;
    --verde-oliva-titoli: #5E6E4F;
    --verde-oliva-scuro: #48543D;
    --terracotta: #A65A4B;
    --terracotta-chiaro: #C98A76;
    --testo-scuro: #3A362F;
    --testo-soft: #6B6659;

    --font-display: 'Cormorant Garamond', serif;
    --font-ui: 'Inter', sans-serif;

    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;

    --shadow-soft: 0 20px 50px rgba(94, 110, 79, 0.10);
    --shadow-lift: 0 25px 60px rgba(94, 110, 79, 0.20);

    --ease: cubic-bezier(.25,.8,.25,1);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    background-color: var(--crema-sfondo);
    margin: 0;
    padding: 0;
    font-family: var(--font-ui);
    color: var(--testo-scuro);
    position: relative;
    overflow-x: hidden;
}

/* Rispetta chi preferisce meno animazioni */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
    }
}

/* Sfondo con le foglie, invariato nel contenuto, opacità ridotta per eleganza */
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: url('Sfondo beige con foglie per sito web.png');
    background-size: 380px;
    background-repeat: repeat;
    opacity: 0.10;
    z-index: -1;
}

a { color: inherit; }

/* Focus visibile per accessibilità da tastiera */
a:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--terracotta);
    outline-offset: 3px;
    border-radius: 6px;
}

/* ===================================================
   FADE-IN MORBIDO ALLO SCROLL (puro CSS)
=================================================== */
.reveal {
    animation: fadeUp 0.9s var(--ease) both;
}
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ===================================================
   NAVIGAZIONE — glass sticky, più raffinata
=================================================== */
.sub-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 18px 20px;
    text-align: center;
    background: rgba(243, 238, 228, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(94, 110, 79, 0.12);
}
.nav-links { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.nav-links li { display: inline; }
.nav-links a {
    text-decoration: none;
    color: var(--verde-oliva-titoli);
    text-transform: uppercase;
    font-size: 0.78rem;
    letter-spacing: 2px;
    font-family: var(--font-ui);
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 30px;
    transition: background-color 0.3s var(--ease), color 0.3s var(--ease);
}
.nav-links a:hover { background-color: var(--verde-oliva-titoli); color: #fff; }

/* ===================================================
   HERO CONTATTI
=================================================== */
.contact-split {
    display: flex;
    min-height: 78vh;
    flex-wrap: wrap;
}

.contact-left {
    flex: 1;
    min-width: 400px;
    position: relative;
    background-image:
        linear-gradient(180deg, rgba(72,84,61,0.10) 0%, rgba(72,84,61,0.35) 100%),
        url('https://images.unsplash.com/photo-1599901860904-17e6ed7083a0?auto=format&fit=crop&w=1200&q=80');
    background-size: cover;
    background-position: center;
    background-color: var(--verde-salvia);
}

/* Monogramma decorativo sull'immagine — firma visiva discreta */
.contact-left::after {
    content: '';
    position: absolute;
    bottom: 30px; left: 30px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 1.4rem;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.85);
}

.contact-right {
    flex: 1;
    min-width: 400px;
    padding: 90px 8%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    background: linear-gradient(180deg, var(--crema-carta) 0%, var(--crema-sfondo) 100%);
}

.contact-content { position: relative; z-index: 1; }

.eyebrow {
    font-family: var(--font-ui);
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--terracotta);
    margin-bottom: 14px;
    display: block;
}

.contact-content h1 {
    font-family: var(--font-display);
    font-size: clamp(2.6rem, 5vw, 3.8rem);
    font-weight: 500;
    color: var(--verde-oliva-titoli);
    margin: 0 0 20px 0;
    line-height: 1.08;
}

.contact-content p.subtitle {
    font-family: var(--font-ui);
    font-size: 1.05rem;
    font-weight: 400;
    color: var(--testo-soft);
    margin-bottom: 44px;
    line-height: 1.7;
    max-width: 480px;
}

.btn-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 10px;
}

.btn-contact {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 17px 20px;
    border: 1px solid rgba(94, 110, 79, 0.35);
    border-radius: var(--radius-sm);
    text-decoration: none;
    color: var(--verde-oliva-titoli);
    font-size: 0.92rem;
    letter-spacing: 0.5px;
    background-color: rgba(255, 255, 255, 0.55);
    transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), background-color 0.3s var(--ease), color 0.3s var(--ease);
    font-family: var(--font-ui);
    font-weight: 600;
    min-height: 48px; /* touch-friendly */
}
.btn-contact svg { width: 20px; height: 20px; flex-shrink: 0; }

.btn-contact:hover, .btn-contact:focus-visible {
    background-color: var(--verde-oliva-titoli);
    color: #fff;
    transform: translateY(-3px);
    box-shadow: var(--shadow-soft);
}

/* ===================================================
   CTA STICKY "PRENOTA ORA" — nuova aggiunta strategica
=================================================== */
.sticky-cta-desktop {
    position: fixed;
    right: 28px;
    bottom: 28px;
    z-index: 60;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--terracotta);
    color: #fff;
    text-decoration: none;
    padding: 16px 26px;
    border-radius: 50px;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.5px;
    box-shadow: 0 15px 35px rgba(166, 90, 75, 0.35);
    transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), background-color 0.3s var(--ease);
}
.sticky-cta-desktop:hover {
    transform: translateY(-4px);
    background-color: var(--verde-oliva-titoli);
    box-shadow: 0 18px 40px rgba(94,110,79,0.35);
}
.sticky-cta-desktop svg { width: 18px; height: 18px; }

.sticky-cta-mobile { display: none; }

@media (max-width: 780px) {
    .sticky-cta-desktop { display: none; }
    .sticky-cta-mobile {
        display: flex;
        position: fixed;
        left: 0; right: 0; bottom: 0;
        z-index: 60;
        justify-content: center;
        align-items: center;
        gap: 10px;
        padding: 14px;
        background: var(--terracotta);
        color: #fff;
        text-decoration: none;
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        box-shadow: 0 -8px 25px rgba(0,0,0,0.12);
        min-height: 56px; /* touch-friendly */
    }
    .sticky-cta-mobile svg { width: 20px; height: 20px; }
    /* Evita che la CTA copra il footer/contenuto */
    body { padding-bottom: 62px; }
}

/* ===================================================
   AVVISO SETTEMBRE — meno "pop-up", più editoriale
=================================================== */
.avviso-settembre {
    background: linear-gradient(135deg, #EFEAE0 0%, #E7E1D3 100%);
    border: 1px solid rgba(94, 110, 79, 0.25);
    border-radius: var(--radius-lg);
    max-width: 780px;
    margin: 60px auto 10px auto;
    padding: 44px 40px;
    box-shadow: var(--shadow-soft);
    position: relative;
    z-index: 2;
}

.avviso-icona {
    font-size: 2rem;
    margin-bottom: 14px;
    text-align: center;
}

.avviso-settembre h4 {
    font-family: var(--font-display);
    color: var(--terracotta);
    font-size: 2rem;
    font-weight: 500;
    margin: 0 0 14px 0;
    text-align: center;
}

.avviso-settembre p {
    font-family: var(--font-ui);
    font-size: 1rem;
    color: var(--testo-scuro);
    margin-bottom: 8px;
    line-height: 1.6;
    text-align: center;
    font-weight: 400;
}

.avviso-settembre p strong { color: var(--verde-oliva-titoli); font-weight: 700; }

.avviso-sub {
    font-style: italic;
    color: var(--verde-oliva-titoli) !important;
    margin-bottom: 28px !important;
    font-family: var(--font-display) !important;
    font-size: 1.15rem !important;
}

.avviso-social { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }

.btn-social {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 26px;
    border-radius: 50px;
    text-decoration: none;
    color: var(--verde-oliva-titoli);
    background-color: rgba(255,255,255,0.6);
    border: 1px solid var(--verde-salvia);
    font-family: var(--font-ui);
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s var(--ease);
    min-height: 44px;
}
.btn-social svg { width: 16px; height: 16px; }
.btn-social:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-soft);
    background-color: var(--verde-oliva-titoli);
    color: white;
    border-color: var(--verde-oliva-titoli);
}

/* ===================================================
   SEZIONE ORARI — card grid al posto della tabella,
   identica e leggibile su desktop e mobile
=================================================== */
.schedule-section { padding: 30px 20px 90px 20px; position: relative; }

.schedule-container {
    max-width: 900px;
    margin: 0 auto;
    background-color: var(--crema-carta);
    border: 1px solid rgba(94, 110, 79, 0.18);
    border-radius: var(--radius-lg);
    padding: 56px 48px;
    text-align: center;
    box-shadow: var(--shadow-soft);
    position: relative;
    z-index: 2;
}

.schedule-logo { max-width: 100px; margin-bottom: 18px; opacity: 0.9; }

.section-label {
    font-family: var(--font-ui);
    text-transform: uppercase;
    letter-spacing: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--terracotta);
    display: block;
    margin-bottom: 10px;
}

.schedule-title {
    font-family: var(--font-display);
    font-size: 2.5rem;
    font-weight: 500;
    color: var(--verde-oliva-titoli);
    margin-bottom: 8px;
    line-height: 1;
}

.schedule-divider {
    width: 50px;
    height: 2px;
    background-color: var(--terracotta);
    margin: 0 auto 32px auto;
    border-radius: 2px;
}

.badges-wrapper { margin-bottom: 44px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

.info-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background-color: rgba(154, 160, 138, 0.15);
    color: var(--testo-scuro);
    padding: 11px 22px;
    border-radius: 30px;
    font-family: var(--font-ui);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    border: 1px solid rgba(154, 160, 138, 0.3);
}
.badge-alert {
    background-color: var(--terracotta);
    color: white;
    border: none;
    box-shadow: 0 6px 16px rgba(166, 90, 75, 0.3);
}

/* Griglia orari — card per giorno */
.day-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 8px;
    text-align: left;
}
@media (max-width: 780px) {
    .day-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
    .day-grid { grid-template-columns: 1fr; }
}

.day-card {
    background: rgba(255,255,255,0.65);
    border: 1px solid rgba(154, 160, 138, 0.3);
    border-radius: var(--radius-sm);
    padding: 20px 22px;
    transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), border-color 0.3s var(--ease);
}
.day-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-soft);
    border-color: var(--verde-salvia);
}
.day-name {
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 0.78rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--verde-oliva-titoli);
    margin-bottom: 12px;
    display: block;
}
.time-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.time-chip {
    font-family: var(--font-ui);
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--testo-scuro);
    background: rgba(166, 90, 75, 0.08);
    border: 1px solid rgba(166, 90, 75, 0.18);
    padding: 5px 11px;
    border-radius: 8px;
}

.schedule-note {
    background-color: rgba(255, 255, 255, 0.7);
    border: 1px solid var(--verde-salvia);
    border-radius: var(--radius-sm);
    padding: 24px 26px;
    font-size: 0.95rem;
    color: var(--testo-scuro);
    line-height: 1.6;
    display: flex;
    align-items: flex-start;
    text-align: left;
    gap: 18px;
    margin-top: 34px;
    font-family: var(--font-ui);
}
.schedule-note svg { width: 26px; height: 26px; flex-shrink: 0; color: var(--verde-oliva-titoli); margin-top: 2px; }

.vibrando-section { margin-top: 56px; }
.vibrando-title {
    font-family: var(--font-display);
    font-size: 1.9rem;
    font-weight: 500;
    color: var(--verde-oliva-titoli);
    margin-bottom: 6px;
}
.vibrando-section .day-grid { grid-template-columns: 1fr; max-width: 260px; margin: 0 auto 20px auto; }

/* ===================================================
   LISTINO PREZZI — il vero "capolavoro" della pagina:
   card comparative + sigillo boutique al posto del
   badge stile volantino
=================================================== */
.pricing-container {
    max-width: 900px;
    margin: 40px auto 0 auto;
    background: linear-gradient(160deg, var(--crema-carta) 0%, #F6F2E9 100%);
    border: 1px solid rgba(94, 110, 79, 0.18);
    border-radius: var(--radius-lg);
    padding: 56px 48px;
    text-align: center;
    box-shadow: var(--shadow-soft);
    position: relative;
    z-index: 2;
}

.pricing-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px;
    margin: 40px 0 48px 0;
}
@media (max-width: 700px) {
    .pricing-cards { grid-template-columns: 1fr; }
}

.price-card {
    position: relative;
    border: 1px solid rgba(94, 110, 79, 0.25);
    border-radius: var(--radius-md);
    padding: 40px 30px 34px 30px;
    background-color: rgba(255, 255, 255, 0.7);
    text-align: center;
    overflow: hidden;
    transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
}
.price-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lift); }

/* La card Reformer leggermente in risalto */
.price-card.featured {
    border-color: var(--terracotta);
    background-color: #fff;
}
.featured-tag {
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    background: var(--terracotta);
    color: #fff;
    font-family: var(--font-ui);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 20px;
}

/* Sigillo circolare per lo sconto — sostituisce il badge "volantino" */
.discount-seal {
    position: absolute;
    top: -18px;
    right: -18px;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--verde-oliva-titoli);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform: rotate(12deg);
    box-shadow: 0 10px 25px rgba(94,110,79,0.35);
    border: 3px solid var(--crema-carta);
}
.discount-seal .num { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; line-height: 1; }
.discount-seal .txt { font-family: var(--font-ui); font-size: 0.55rem; letter-spacing: 1px; text-transform: uppercase; }

.price-card h3 {
    font-family: var(--font-display);
    font-size: 2rem;
    color: var(--verde-oliva-titoli);
    margin: 8px 0 4px 0;
    font-weight: 500;
    letter-spacing: 1px;
}
.price-card .capacity {
    font-size: 0.85rem;
    color: var(--testo-soft);
    font-family: var(--font-ui);
    margin-bottom: 26px;
}

.price-figures {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 14px;
    margin-bottom: 6px;
}
.old-price {
    text-decoration: line-through;
    text-decoration-color: var(--terracotta);
    text-decoration-thickness: 2px;
    color: var(--testo-soft);
    font-family: var(--font-ui);
    font-size: 1.2rem;
    font-weight: 500;
}
.new-price .amount {
    font-family: var(--font-display);
    font-size: 3.2rem;
    color: var(--verde-oliva-titoli);
    font-weight: 600;
}
.price-card .label {
    font-size: 0.8rem;
    font-family: var(--font-ui);
    color: var(--testo-soft);
    letter-spacing: 0.5px;
}

.promo-note {
    display: inline-block;
    margin-top: 40px;
    font-family: var(--font-ui);
    font-size: 0.8rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--verde-oliva-titoli);
    font-weight: 700;
    border-top: 1px solid rgba(94,110,79,0.25);
    padding-top: 18px;
}

/* Note informative sotto ai prezzi */
.pricing-notes-list { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; text-align: left; }

.pricing-note-item {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 20px 4px;
    border-bottom: 1px solid rgba(154, 160, 138, 0.2);
}
.pricing-note-item:last-child { border-bottom: none; }

.note-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1.5px solid var(--verde-oliva-titoli);
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--verde-oliva-titoli);
    flex-shrink: 0;
    background: rgba(255,255,255,0.5);
}
.note-icon svg { width: 20px; height: 20px; }

.note-text { font-size: 0.98rem; color: var(--testo-scuro); line-height: 1.5; font-family: var(--font-ui); }
.note-text strong { color: var(--verde-oliva-titoli); font-weight: 700; }

/* ===================================================
   MAPPA — nuova sezione strategica
=================================================== */
.map-section { padding: 10px 20px 90px 20px; position: relative; z-index: 2; }
.map-container {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
}
.map-frame-wrap {
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid rgba(94, 110, 79, 0.2);
    box-shadow: var(--shadow-soft);
    margin-top: 30px;
    filter: saturate(0.9);
}
.map-frame-wrap iframe { display: b
