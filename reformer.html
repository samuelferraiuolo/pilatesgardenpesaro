<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reformer | Pilates Garden Pesaro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <style>
    :root {
      /* Compatibilità con i token già presenti in common.css */
      --cream: var(--crema-sfondo);
      --olive: var(--verde-oliva-titoli);
      --sage: var(--verde-salvia);
      --ink: var(--testo-scuro);
      --font-display: "Cormorant Garamond", serif;
      --font-body: "Inter", sans-serif;
      --radius-small: 14px;
      --radius-medium: 22px;
      --radius-large: 34px;
      --shadow-soft: 0 22px 60px color-mix(in srgb, var(--olive) 15%, transparent);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; overflow-x: hidden; color: var(--ink); font-family: var(--font-body); background: var(--cream); }
    a { -webkit-tap-highlight-color: transparent; }

    .site-header { position: relative; z-index: 20; background: var(--cream); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .72rem clamp(1.25rem, 5vw, 5rem); color: var(--cream); background: var(--olive); font-size: .67rem; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; }
    .topbar p { margin: 0; }
    .topbar a { color: inherit; text-decoration: none; }

    .navbar { display: grid; grid-template-columns: 160px 1fr auto; align-items: center; gap: 2rem; max-width: 1280px; min-height: 84px; margin: auto; padding: .85rem clamp(1.25rem, 4vw, 3rem); }
    .nav-logo img { display: block; width: 138px; max-height: 55px; }
    .nav-links { display: flex; justify-content: center; gap: clamp(1rem, 2.5vw, 2.5rem); }
    .nav-links a { position: relative; padding: .55rem 0; color: var(--olive); font-size: .69rem; font-weight: 500; letter-spacing: .13em; text-decoration: none; text-transform: uppercase; }
    .nav-links a::after { position: absolute; right: 0; bottom: 0; left: 0; height: 1px; content: ""; background: var(--sage); transform: scaleX(0); transform-origin: center; transition: transform .28s ease; }
    .nav-links a:hover::after, .nav-links .active::after { transform: scaleX(1); }
    .nav-cta, .button { display: inline-flex; align-items: center; justify-content: center; min-height: 51px; padding: .8rem 1.45rem; border-radius: 999px; font-family: var(--font-body); font-size: .69rem; font-weight: 500; letter-spacing: .13em; text-decoration: none; text-transform: uppercase; transition: transform .28s ease, box-shadow .28s ease, background .28s ease; }
    .nav-cta { color: var(--cream); background: var(--olive); }
    .nav-cta:hover, .button:hover { transform: translateY(-3px); box-shadow: var(--shadow-soft); }
    .mobile-menu { display: none; position: relative; }
    .mobile-menu summary { cursor: pointer; list-style: none; color: var(--olive); font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; }
    .mobile-menu summary::-webkit-details-marker { display: none; }
    .mobile-menu nav { position: absolute; top: 2rem; right: 0; display: grid; width: 210px; padding: .7rem; border-radius: var(--radius-small); background: var(--cream); box-shadow: var(--shadow-soft); }
    .mobile-menu nav a { padding: .8rem; color: var(--olive); font-size: .72rem; letter-spacing: .1em; text-decoration: none; text-transform: uppercase; }

    .hero-reformer { position: relative; display: grid; min-height: min(74vh, 780px); padding: 7rem 1.5rem 12rem; overflow: hidden; place-items: center; isolation: isolate; background: url("imag5.jpg") center / cover no-repeat; clip-path: polygon(0 0, 100% 0, 100% 90%, 55% 100%, 0 92%); }
    .hero-reformer::before { position: absolute; z-index: -1; inset: 0; content: ""; background: linear-gradient(125deg, color-mix(in srgb, var(--olive) 82%, transparent), color-mix(in srgb, var(--olive) 35%, transparent)); }
    .hero-reformer::after { position: absolute; z-index: -1; inset: -8%; content: ""; border: 1px solid color-mix(in srgb, var(--cream) 38%, transparent); border-radius: 50%; transform: rotate(-20deg) scale(1.3); opacity: .5; }
    .hero-content { max-width: 760px; color: var(--cream); text-align: center; animation: heroReveal 1.1s cubic-bezier(.2,.7,.2,1) both; }
    .hero-eyebrow, .section-kicker { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: 0 0 1.25rem; color: var(--sage); font-size: .68rem; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; }
    .hero-eyebrow { color: var(--cream); }
    .hero-eyebrow::before, .hero-eyebrow::after, .section-kicker::before, .section-kicker::after { width: 38px; height: 1px; content: ""; background: currentColor; opacity: .78; }
    h1, h2, blockquote { font-family: var(--font-display); font-weight: 400; }
    .hero-content h1 { margin: 0; font-size: clamp(4.6rem, 11vw, 8.7rem); line-height: .8; letter-spacing: -.045em; }
    .hero-description { max-width: 540px; margin: 1.6rem auto 0; font-size: clamp(1rem, 2vw, 1.18rem); line-height: 1.75; }
    .hero-actions, .cross-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .9rem; margin-top: 2.2rem; }
    .button-primary { color: var(--cream); background: var(--olive); }
    .button-secondary { color: var(--olive); border: 1px solid color-mix(in srgb, var(--cream) 72%, transparent); background: color-mix(in srgb, var(--cream) 89%, transparent); backdrop-filter: blur(10px); }

    .main-content { position: relative; z-index: 2; max-width: 1120px; margin: clamp(-95px, -7vw, -66px) auto 5rem; padding: 0 1.25rem; }
    .content-section { padding: clamp(2.5rem, 7vw, 5.6rem); border: 1px solid color-mix(in srgb, var(--cream) 78%, transparent); border-radius: var(--radius-large); background: linear-gradient(135deg, color-mix(in srgb, var(--cream) 98%, transparent), color-mix(in srgb, var(--cream) 86%, transparent)); box-shadow: var(--shadow-soft); backdrop-filter: blur(18px); }
    .brand-logo { display: block; width: min(175px, 55%); margin: 0 auto 2.5rem; animation: fadeUp .9s .2s ease both; }
    .section-heading { max-width: 760px; margin: 0 auto; text-align: center; }
    h2 { margin: 0; color: var(--olive); font-size: clamp(3rem, 6vw, 5rem); line-height: .95; letter-spacing: -.035em; }
    .lead { max-width: 750px; margin: 2rem auto 0; font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.9; text-align: center; }

    .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4rem; margin: clamp(3rem, 7vw, 5rem) 0; }
    .feature-item { padding: 2.5rem 1.5rem; text-align: center; border: 1px solid color-mix(in srgb, var(--sage) 35%, transparent); border-radius: var(--radius-medium); background: color-mix(in srgb, var(--cream) 62%, transparent); transition: transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .4s ease; }
    .feature-item:hover { transform: translateY(-10px); box-shadow: var(--shadow-soft); }
    .feature-item img { width: 78px; height: 78px; object-fit: contain; animation: iconFloat 4.5s ease-in-out infinite; }
    .feature-item:nth-child(2) img { animation-delay: -1.5s; }
    .feature-item:nth-child(3) img { animation-delay: -3s; }
    .feature-item h3 { margin: 1.35rem 0 .75rem; color: var(--olive); font-family: var(--font-body); font-size: .78rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; }
    .feature-item p { margin: 0; font-size: .94rem; line-height: 1.7; }
    .premium-note { max-width: 700px; margin: 0 auto; padding: 1.65rem 2rem; color: var(--olive); text-align: center; border: 1px solid var(--sage); border-radius: var(--radius-medium); background: color-mix(in srgb, var(--cream) 67%, transparent); }
    .premium-note strong { font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; }
    .testimonial-section { position: relative; max-width: 900px; margin: clamp(3.2rem, 7vw, 5.8rem) auto; padding: clamp(2.9rem, 6vw, 4.8rem); overflow: hidden; color: var(--cream); text-align: center; border-radius: var(--radius-large); background: var(--olive); }
    .testimonial-section::before { position: absolute; top: -2.2rem; left: 50%; content: "“"; color: var(--sage); font-family: var(--font-display); font-size: 11rem; line-height: 1; opacity: .52; transform: translateX(-50%); }
    blockquote { position: relative; max-width: 690px; margin: 1.5rem auto 0; font-size: clamp(2rem, 4vw, 3.2rem); line-height: 1.08; }
    .testimonial-section cite { position: relative; display: block; margin-top: 1.5rem; font-size: .72rem; font-style: normal; letter-spacing: .18em; text-transform: uppercase; }
    .explore-section { padding-top: 1rem; text-align: center; }
    .explore-section::before { display: block; width: 1px; height: 58px; margin: 0 auto 2.5rem; content: ""; background: var(--sage); }
    .explore-section p:not(.section-kicker) { max-width: 520px; margin: 1.5rem auto 0; line-height: 1.8; }

    footer { padding: 2.5rem 1.5rem; color: var(--cream); text-align: center; background: var(--olive); }
    .footer-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.4rem; margin-bottom: 1.25rem; }
    .footer-nav a { color: var(--cream); font-size: .68rem; letter-spacing: .13em; text-decoration: none; text-transform: uppercase; }
    footer p { margin: 0; font-size: .7rem; line-height: 1.8; opacity: .86; }
    .footer-legal { margin-top: .7rem; }
    .footer-legal a { color: inherit; }
